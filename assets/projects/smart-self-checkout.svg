  <text x="32" y="96" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" fill="#cbd5e1">Retail self-checkout: scan barcodes with the phone camera, pay by card</text><text x="32" y="118" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" fill="#cbd5e1">/ UPI / Razorpay, get a GST invoice with a signed QR exit pass. Staff</text><text x="32" y="140" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14.5" fill="#cbd5e1">dashboard for inventory, sales and refunds.</text>
