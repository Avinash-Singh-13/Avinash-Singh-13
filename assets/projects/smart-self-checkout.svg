<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-label="Smart Self-Checkout: Retail self-checkout: scan barcodes with the phone camera, pay by card / UPI / Razorpay, get a GST invoice with a signed QR exit pass. Staff dashboard for inventory, sales and refunds.">
  <title>Smart Self-Checkout: Retail self-checkout: scan barcodes with the phone camera, pay by card / UPI / Razorpay, get a GST invoice with a signed QR exit pass. Staff dashboard for inventory, sales and refunds.</title>
  <defs>
    <linearGradient id="psmartselfcheckoutbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#0d0a24"/>
    </linearGradient>
    <filter id="psmartselfcheckoutblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <linearGradient id="psmartselfcheckoutglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="psmartselfcheckoutedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="psmartselfcheckouttext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <clipPath id="psmartselfcheckoutclip"><rect width="590" height="230" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#psmartselfcheckoutclip)">
    <rect width="590" height="230" fill="url(#psmartselfcheckoutbg)"/>
    <g filter="url(#psmartselfcheckoutblur)" opacity="0.85">
      
      <circle cx="90" cy="60" r="110" fill="#2563eb">
        <animate attributeName="cx" values="90;120;90" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;80;60" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="510" cy="190" r="120" fill="#7c3aed">
        <animate attributeName="cx" values="510;480;510" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="190;170;190" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
    <rect x="8" y="8" width="574" height="214" rx="20" fill="url(#psmartselfcheckoutglass)"/>
    <rect x="8.75" y="8.75" width="572.5" height="212.5" rx="20" fill="none" stroke="url(#psmartselfcheckoutedge)" stroke-width="1.5"/>
    <rect x="24" y="9" width="542" height="1" fill="#ffffff" opacity="0.35"/>
